<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elearn — What will you learn today?</title>
  <link rel="stylesheet" href="style.css">
</head>

<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2b;
    --panel-2: #16233a;
    --border: rgba(255, 255, 255, 0.08);
    --text: #eef1f7;
    --text-dim: #9aa5b8;
    --text-dimmer: #6b7690;
    --accent: #3b82f6;
    --accent-2: #60a5fa;
    --gold: #f5b83d;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 320px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 34px;
  }

  .brand svg {
    flex-shrink: 0;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav a svg {
    flex-shrink: 0;
    opacity: 0.85;
  }

  .nav a:hover {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
  }

  .nav a.active {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .menu-toggle {
    display: none;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    padding: 0;
    background: transparent;
    border: none;
    cursor: pointer;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .menu-toggle .bar {
    width: 22px;
    height: 2px;
    border-radius: 2px;
    background: var(--text);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .menu-toggle.is-active .bar:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .menu-toggle.is-active .bar:nth-child(2) {
    opacity: 0;
  }

  .menu-toggle.is-active .bar:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  .account {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 8px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f6a5c0, #f08bb0);
    flex-shrink: 0;
  }

  .account-info {
    line-height: 1.3;
    flex: 1;
  }

  .account-info .name {
    font-weight: 600;
    font-size: 0.9rem;
  }

  .account-info .plan {
    font-size: 0.8rem;
    color: var(--text-dimmer);
  }

  .account-toggle {
    color: var(--text-dimmer);
    font-size: 0.9rem;
  }

  /* ---------- Main content ---------- */
  .main {
    flex: 1;
    padding: 40px 48px 60px;
    max-width: 1200px;
  }

  .greeting p {
    margin: 0 0 6px;
    color: var(--text-dim);
    font-size: 1rem;
  }

  .greeting h1 {
    margin: 0 0 28px;
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  /* ---------- Promo card ---------- */
  .promo {
    position: relative;
    background:
      radial-gradient(1200px 260px at 15% 20%, rgba(59, 130, 246, 0.10), transparent 60%),
      linear-gradient(135deg, #14233a, #101a2c);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 36px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    overflow: hidden;
    margin-bottom: 44px;
  }

  .promo-illustration {
    flex-shrink: 0;
    width: 300px;
  }

  .promo-illustration svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .promo-copy {
    flex: 1;
    min-width: 240px;
  }

  .promo-copy h2 {
    margin: 0 0 14px;
    font-size: 1.7rem;
    font-weight: 800;
    line-height: 1.25;
  }

  .promo-copy p {
    margin: 0 0 22px;
    color: var(--text-dim);
    font-size: 0.95rem;
    line-height: 1.6;
    max-width: 42ch;
  }

  .btn-primary {
    background: #ffffff;
    color: #0b1220;
    border: none;
    padding: 14px 26px;
    border-radius: var(--radius-sm);
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(255, 255, 255, 0.12);
  }

  .promo-mark {
    flex-shrink: 0;
    width: 90px;
    opacity: 0.9;
  }

  .promo-mark svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .dots {
    position: absolute;
    bottom: 22px;
    left: 40px;
    display: flex;
    gap: 8px;
  }

  .dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
  }

  .dots span.active {
    background: #ffffff;
  }

  /* ---------- Learning path ---------- */
  .courses a {
    display: flex;
    flex-direction: column;
    height: 100%;
    color: inherit;
    text-decoration: none;
  }

  .courses a .course-card {
    flex: 1;
    width: 100%;
  }

  .section-title {
    font-size: 1.3rem;
    font-weight: 800;
    margin: 0 0 20px;
  }

  .courses {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }

  .course-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    transition: border-color 0.15s ease;
  }

  .course-card:hover {
    border-color: rgba(255, 255, 255, 0.18);
  }

  .course-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 6px;
  }

  .course-sub {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin: 0;
    line-height: 1.5;
  }

  .course-students {
    color: var(--text-dimmer);
    font-size: 0.82rem;
  }

  .course-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .avatar-stack {
    display: flex;
  }

  .avatar-stack span {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--panel);
    margin-left: -10px;
    background: linear-gradient(135deg, #7f9cf5, #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar-stack span:first-child {
    margin-left: 0;
  }

  .course-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-dim);
  }

  .star {
    color: var(--gold);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 980px) {
    .courses {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 860px) {
    body {
      flex-direction: column;
    }

    .sidebar {
      width: 100%;
      height: auto;
      position: sticky;
      top: 0;
      z-index: 10;
      flex-direction: column;
      align-items: stretch;
      padding: 14px 16px;
      gap: 12px;
    }

    .sidebar>div {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-toggle {
      display: flex;
    }

    .nav {
      display: none;
      flex-direction: column;
      gap: 4px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .nav.open {
      display: flex;
    }

    .nav a {
      padding: 12px 14px;
      font-size: 0.95rem;
    }

    .account {
      display: none;
    }

    .brand {
      margin-bottom: 0;
      font-size: 1.05rem;
    }

    .main {
      padding: 24px 16px 40px;
      max-width: 100%;
    }

    .greeting h1 {
      font-size: 1.6rem;
      margin-bottom: 20px;
    }

    .promo {
      flex-wrap: wrap;
      padding: 24px 22px;
      gap: 20px;
    }

    .promo-illustration {
      order: 2;
      width: 220px;
      margin: 0 auto;
    }

    .promo-mark {
      display: none;
    }

    .promo-copy h2 {
      font-size: 1.4rem;
    }

    .courses {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 480px) {
    .sidebar {
      padding: 12px;
    }

    .brand {
      font-size: 0.95rem;
      gap: 8px;
    }

    .brand svg {
      width: 24px;
      height: 24px;
    }

    .nav a {
      padding: 9px 10px;
      font-size: 0.82rem;
      gap: 8px;
    }

    .nav a svg {
      width: 16px;
      height: 16px;
    }

    .main {
      padding: 20px 14px 32px;
    }

    .greeting h1 {
      font-size: 1.35rem;
    }

    .promo {
      padding: 20px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 32px;
    }

    .promo-illustration {
      width: 170px;
    }

    .promo-copy h2 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .promo-copy p {
      font-size: 0.88rem;
      max-width: none;
    }

    .btn-primary {
      width: 100%;
      padding: 13px 20px;
      font-size: 0.9rem;
    }

    .section-title {
      font-size: 1.1rem;
    }

    .course-card {
      padding: 18px;
    }
  }

  :focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>


<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <div class="sidebar-header">
        <div class="brand">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 3C9 3 7 5 7 7.5C5.5 7.8 4.5 9 4.5 10.5C4.5 11.3 4.8 12 5.3 12.5C4.8 13 4.5 13.7 4.5 14.5C4.5 16 5.6 17.2 7 17.4V19C7 20.1 7.9 21 9 21H12V3Z"
              fill="#4f8bf0" />
            <path
              d="M12 3C15 3 17 5 17 7.5C18.5 7.8 19.5 9 19.5 10.5C19.5 11.3 19.2 12 18.7 12.5C19.2 13 19.5 13.7 19.5 14.5C19.5 16 18.4 17.2 17 17.4V19C17 20.1 16.1 21 15 21H12V3Z"
              fill="#2d63c8" />
          </svg>
          Programming for Baccalaureate
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false"
          aria-controls="siteNav">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>

      <nav class="nav" id="siteNav">
        <a href="#" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="4" width="16" height="16" rx="2" />
            <path d="M4 9h16M9 9v11" />
          </svg>
          Lectures
        </a>
        <a href="./homework-questions.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="5" y="3" width="14" height="18" rx="2" />
            <path d="M9 8h6M9 12h6M9 16h4" />
          </svg>
          Homework Questions
        </a>
        <a href="homework-videos.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="5" y="3" width="14" height="18" rx="2" />
            <path d="M9 8h6M9 12h6M9 16h4" />
          </svg>
          Homework Videos
        </a>
        <a href="#">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="9" r="4" />
            <path d="M8 21l4-3 4 3-1.5-6M9.5 12l1.5 6" />
          </svg>
          Ask
        </a>
      </nav>
    </div>

  </aside>

  <!-- Main -->
  <main class="main">
    <h1>What will you learn today?</h1>
    </div>

    <section class="promo">
      <div class="promo-illustration">
        <svg viewBox="0 0 300 240" fill="none">
          <rect x="30" y="150" width="220" height="14" rx="4" fill="#d97a3f" />
          <rect x="55" y="90" width="18" height="70" fill="#d97a3f" />
          <rect x="200" y="90" width="18" height="70" fill="#d97a3f" />
          <circle cx="130" cy="95" r="30" fill="#e7ceb5" />
          <rect x="105" y="120" width="50" height="55" rx="10" fill="#4f6bd8" />
          <rect x="150" y="105" width="55" height="35" rx="4" fill="#ffffff" opacity="0.95" />
          <circle cx="220" cy="80" r="20" fill="#4f8bf0" />
          <circle cx="80" cy="70" r="16" fill="#e0603f" />
          <rect x="60" y="170" width="30" height="45" fill="#4f6bd8" />
          <rect x="95" y="180" width="35" height="35" fill="#f0b93d" />
        </svg>
      </div>

      <div class="promo-copy">
        <h2>New Lecture: How Ai Works</h2>
        <button class="btn-primary">Learn now</button>
      </div>

      <div class="promo-mark">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M20 20 L80 80 M80 20 L20 80" stroke="#4f8bf0" stroke-width="6" stroke-linecap="round" />
          <path d="M50 10 L90 50 L50 90" stroke="#2d63c8" stroke-width="6" fill="none" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </div>
    </section>

    <h2 class="section-title">New Lectures</h2>

    <div class="courses">
      <a href="./lecture.html">
        <article class="course-card">
          <div>
            <h3 class="course-title">Lecture 1: How Ai Works</h3>
            <p class="course-sub">1 hour</p>
          </div>
        </article>
      </a>

      <article class="course-card">
        <div>
          <h3 class="course-title">Lecture 2</h3>
          <p class="course-sub">1 hour</p>
        </div>
      </article>

      <article class="course-card">
        <div>
          <h3 class="course-title">Lecture 3</h3>
          <p class="course-sub">1 hour</p>
        </div>
      </article>
    </div>
  </main>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const siteNav = document.getElementById('siteNav');

    menuToggle.addEventListener('click', () => {
      const isOpen = siteNav.classList.toggle('open');
      menuToggle.classList.toggle('is-active', isOpen);
      menuToggle.setAttribute('aria-expanded', isOpen);
    });

    // Close the menu after tapping a link
    siteNav.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => {
        siteNav.classList.remove('open');
        menuToggle.classList.remove('is-active');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });

    // Reset menu state if the viewport grows back to desktop size
    window.addEventListener('resize', () => {
      if (window.innerWidth > 860) {
        siteNav.classList.remove('open');
        menuToggle.classList.remove('is-active');
        menuToggle.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
</body>

</html>
