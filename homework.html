<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elearn — Homework</title>
<style>
  :root{
    --bg: #0b1220;
    --panel: #111a2b;
    --border: rgba(255,255,255,0.08);
    --text: #eef1f7;
    --text-dim: #9aa5b8;
    --text-dimmer: #6b7690;
    --accent-2: #60a5fa;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body{
    display:flex;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width: 320px;
    flex-shrink:0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 28px 20px;
    display:flex;
    flex-direction:column;
    justify-content: space-between;
    position: sticky;
    top:0;
    height:100vh;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 34px;
}
.brand svg {
    flex-shrink: 0;
}

  .nav{
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .nav a{
    display:flex;
    align-items:center;
    gap:14px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    text-decoration:none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav a svg{ flex-shrink:0; opacity: 0.85; }

  .nav a:hover{
    background: rgba(255,255,255,0.04);
    color: var(--text);
  }

  .nav a.active{
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }

  .account{
    display:flex;
    align-items:center;
    gap:12px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .avatar{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f6a5c0, #f08bb0);
    flex-shrink:0;
  }

  .account-info{ line-height: 1.3; flex:1; }
  .account-info .name{ font-weight: 600; font-size: 0.9rem; }
  .account-info .plan{ font-size: 0.8rem; color: var(--text-dimmer); }
  .account-toggle{ color: var(--text-dimmer); font-size: 0.9rem; }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    padding: 40px 48px 60px;
    max-width: 900px;
  }

  .page-title{
    margin: 0 0 28px;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .lesson-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .lesson-list li a{
    display:block;
    padding: 18px 22px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text);
    text-decoration:none;
    font-size: 1rem;
    font-weight: 600;
    transition: border-color 0.15s ease;
  }

  .lesson-list li a:hover{
    border-color: rgba(255,255,255,0.2);
  }

  :focus-visible{
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  @media (max-width: 860px){
    body{ flex-direction: column; }
    .sidebar{
      width: 100%;
      height: auto;
      position: relative;
      flex-direction: row;
      align-items:center;
      padding: 16px 20px;
    }
    .nav{ flex-direction:row; }
    .account{ display:none; }
    .brand{ margin-bottom:0; margin-right: 20px; }
    .main{ padding: 28px 20px 40px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
